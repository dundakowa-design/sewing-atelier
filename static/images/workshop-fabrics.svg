<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стеллаж с рулонами ткани разных цветов">
  <rect width="400" height="300" fill="#faf9f6"/>

  <!-- стеллаж -->
  <rect x="20" y="20" width="360" height="10" fill="#1e2222"/>
  <rect x="20" y="110" width="360" height="10" fill="#1e2222"/>
  <rect x="20" y="200" width="360" height="10" fill="#1e2222"/>
  <rect x="20" y="20" width="10" height="190" fill="#1e2222"/>
  <rect x="370" y="20" width="10" height="190" fill="#1e2222"/>

  <!-- рулоны ткани, полка 1 -->
  <g>
    <rect x="40" y="46" width="60" height="64" rx="8" fill="#c1440e"/>
    <ellipse cx="40" cy="78" rx="8" ry="32" fill="#9c360a"/>
    <rect x="108" y="50" width="60" height="60" rx="8" fill="#32475a"/>
    <ellipse cx="108" cy="80" rx="8" ry="30" fill="#233240"/>
    <rect x="176" y="44" width="60" height="66" rx="8" fill="#e3d9c4"/>
    <ellipse cx="176" cy="77" rx="8" ry="33" fill="#c9bb9d"/>
    <rect x="244" y="52" width="60" height="58" rx="8" fill="#7a8f6b"/>
    <ellipse cx="244" cy="81" rx="8" ry="29" fill="#5f7052"/>
    <rect x="312" y="48" width="52" height="62" rx="8" fill="#d3a35e"/>
    <ellipse cx="312" cy="79" rx="7" ry="31" fill="#b3813c"/>
  </g>

  <!-- рулоны ткани, полка 2 -->
  <g>
    <rect x="40" y="136" width="52" height="64" rx="8" fill="#32475a"/>
    <ellipse cx="40" cy="168" rx="7" ry="32" fill="#233240"/>
    <rect x="100" y="140" width="60" height="60" rx="8" fill="#c1440e"/>
    <ellipse cx="100" cy="170" rx="8" ry="30" fill="#9c360a"/>
    <rect x="168" y="132" width="56" height="68" rx="8" fill="#7a8f6b"/>
    <ellipse cx="168" cy="166" rx="8" ry="34" fill="#5f7052"/>
    <rect x="232" y="142" width="60" height="58" rx="8" fill="#e3d9c4"/>
    <ellipse cx="232" cy="171" rx="8" ry="29" fill="#c9bb9d"/>
    <rect x="300" y="138" width="56" height="62" rx="8" fill="#d3a35e"/>
    <ellipse cx="300" cy="169" rx="8" ry="31" fill="#b3813c"/>
  </g>

  <!-- пол -->
  <rect x="0" y="220" width="400" height="80" fill="#e7e0d0"/>

  <!-- корзина с обрезками -->
  <path d="M150 300 L160 236 L240 236 L250 300 Z" fill="#1e2222"/>
  <path d="M165 236 L175 216 L225 216 L235 236 Z" fill="#c1440e"/>
</svg>
