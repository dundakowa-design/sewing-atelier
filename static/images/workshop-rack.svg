<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стойка с готовой одеждой после пошива">
  <rect width="400" height="300" fill="#faf9f6"/>
  <rect x="0" y="0" width="400" height="230" fill="#f2efe8"/>
  <rect x="0" y="230" width="400" height="70" fill="#e7e0d0"/>

  <!-- стойка -->
  <rect x="40" y="40" width="320" height="8" fill="#1e2222"/>
  <rect x="46" y="40" width="6" height="200" fill="#1e2222"/>
  <rect x="348" y="40" width="6" height="200" fill="#1e2222"/>

  <!-- вешалка + одежда 1 -->
  <g transform="translate(80,48)">
    <path d="M20 0 L20 -8" stroke="#1e2222" stroke-width="3"/>
    <path d="M0 0 C0 -10 40 -10 40 0" fill="none" stroke="#1e2222" stroke-width="3"/>
    <path d="M4 0 L36 0 L44 100 C34 112 6 112 -4 100 Z" fill="#c1440e"/>
  </g>

  <!-- вешалка + одежда 2 -->
  <g transform="translate(150,44)">
    <path d="M20 0 L20 -8" stroke="#1e2222" stroke-width="3"/>
    <path d="M0 0 C0 -10 40 -10 40 0" fill="none" stroke="#1e2222" stroke-width="3"/>
    <path d="M4 0 L36 0 L46 108 C34 122 6 122 -6 108 Z" fill="#32475a"/>
  </g>

  <!-- вешалка + одежда 3 -->
  <g transform="translate(224,50)">
    <path d="M20 0 L20 -8" stroke="#1e2222" stroke-width="3"/>
    <path d="M0 0 C0 -10 40 -10 40 0" fill="none" stroke="#1e2222" stroke-width="3"/>
    <path d="M4 0 L36 0 L42 96 C32 108 8 108 -2 96 Z" fill="#7a8f6b"/>
  </g>

  <!-- вешалка + одежда 4 -->
  <g transform="translate(296,46)">
    <path d="M20 0 L20 -8" stroke="#1e2222" stroke-width="3"/>
    <path d="M0 0 C0 -10 40 -10 40 0" fill="none" stroke="#1e2222" stroke-width="3"/>
    <path d="M4 0 L36 0 L44 104 C34 116 6 116 -4 104 Z" fill="#d3a35e"/>
  </g>

  <!-- бирки -->
  <circle cx="120" cy="152" r="4" fill="#faf9f6" stroke="#1e2222" stroke-width="1.5"/>
  <circle cx="196" cy="166" r="4" fill="#faf9f6" stroke="#1e2222" stroke-width="1.5"/>
</svg>
