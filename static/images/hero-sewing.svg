<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стилизованная иллюстрация промышленной швейной машины">
  <rect width="560" height="480" fill="#faf9f6" rx="16"/>

  <!-- нить-спираль на фоне -->
  <path d="M60 400 C 160 460, 420 460, 500 380 C 560 320, 480 240, 400 280 C 330 314, 340 380, 400 400"
        fill="none" stroke="#dedad0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- стол -->
  <rect x="60" y="360" width="440" height="18" fill="#b9835a"/>
  <rect x="80" y="378" width="18" height="70" fill="#8a6440"/>
  <rect x="462" y="378" width="18" height="70" fill="#8a6440"/>

  <!-- ткань под иглой -->
  <rect x="150" y="330" width="170" height="30" rx="4" fill="#e3d9c4"/>
  <path d="M150 345 L320 345" stroke="#c9bb9d" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- корпус машины -->
  <g>
    <rect x="120" y="240" width="230" height="90" rx="14" fill="#1e2222"/>
    <path d="M128 240 C128 140 230 96 320 130 L320 240 Z" fill="#1e2222"/>
    <rect x="272" y="86" width="26" height="52" rx="6" fill="#1e2222"/>
    <rect x="278" y="70" width="14" height="24" rx="3" fill="#1e2222"/>

    <!-- игла -->
    <rect x="230" y="240" width="6" height="60" fill="#c1440e"/>

    <!-- маховик -->
    <circle cx="330" cy="200" r="26" fill="none" stroke="#c1440e" stroke-width="7"/>
    <circle cx="330" cy="200" r="6" fill="#c1440e"/>

    <!-- катушка нитей на верхушке -->
    <rect x="150" y="76" width="20" height="30" rx="3" fill="#c1440e"/>
    <rect x="146" y="72" width="28" height="6" fill="#1e2222"/>
    <rect x="146" y="104" width="28" height="6" fill="#1e2222"/>
    <path d="M160 106 C 170 150, 210 150, 236 130" fill="none" stroke="#c1440e" stroke-width="2.5"/>

    <!-- панель управления -->
    <rect x="150" y="256" width="60" height="14" rx="3" fill="#32475a"/>
    <circle cx="160" cy="263" r="3" fill="#c1440e"/>
    <circle cx="172" cy="263" r="3" fill="#faf9f6"/>
    <circle cx="184" cy="263" r="3" fill="#faf9f6"/>
  </g>

  <!-- педаль -->
  <path d="M300 440 L360 440 L352 460 L292 460 Z" fill="#32475a"/>
  <path d="M330 400 C 330 415, 335 425, 340 440" fill="none" stroke="#1e2222" stroke-width="3"/>
</svg>
